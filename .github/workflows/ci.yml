# CI de Social Graph Service: em cada pull request, lint e, só se passar, testes.
# O build usa a raiz do monorepo (precisa das libs/* e do pom.xml agregador): o checkout é da raiz.
name: CI Social Graph Service

on:
  pull_request:

concurrency:
  group: ci-social_graph_service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Não há Checkstyle/Spotless no projeto (adicionar exige aprovação de dependência): por ora o lint é a compilação
      # do serviço e das libs que ele usa, com os avisos do compilador ligados.
      - name: Compilar com avisos do compilador
        run: mvn -B -ntp -pl social_graph_service -am -DskipTests -Dmaven.compiler.showWarnings=true compile

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Os testes de integração usam PostgreSQL embarcado: não precisam de Docker.
      - name: Testes (inclui as libs/* usadas pelo serviço)
        run: mvn -B -ntp -pl social_graph_service -am test
