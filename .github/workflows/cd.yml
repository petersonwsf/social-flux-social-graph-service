# CD de Social Graph Service: após o merge na main, repete os testes, publica a imagem no GHCR e atualiza a VPS.
# Este repositório contém só o serviço; as libs compartilhadas vêm dos repositórios social-flux-lib-*.
name: CD Social Graph Service

on:
  push:
    branches: [ "main" ]

concurrency:
  group: cd-social_graph_service
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Testes pós-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: social_graph_service

      - name: Código da lib socialflux-events
        uses: actions/checkout@v4
        with:
          repository: petersonwsf/social-flux-lib-events
          path: libs/socialflux-events

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      # As libs compartilhadas são dependências Maven: instaladas no repositório local antes do serviço.
      - name: Instalar as libs compartilhadas
        run: |
          mvn -B -ntp -q -DskipTests -f libs/socialflux-events/pom.xml install

      - name: Testes
        run: mvn -B -ntp -f social_graph_service/pom.xml test

  publish_ghcr:
    name: Imagem no GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: social_graph_service

      - name: Código da lib socialflux-events
        uses: actions/checkout@v4
        with:
          repository: petersonwsf/social-flux-lib-events
          path: libs/socialflux-events

      # O Dockerfile espera o layout do monorepo (libs/* e social_graph_service/ lado a lado) com a raiz como contexto.
      - name: Ignorar .git e target no contexto
        run: printf '**/.git\n**/target\n' > .dockerignore

      # O GHCR exige o nome da imagem em minúsculas.
      - name: Nome da imagem em minúsculas
        id: img
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Login no GHCR
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ./social_graph_service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.owner }}/social_flux_social_graph_service:latest
            ghcr.io/${{ steps.img.outputs.owner }}/social_flux_social_graph_service:${{ github.sha }}

  deploy_vps:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: publish_ghcr
    steps:
      - name: Atualizar container na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose pull social_graph_service
            docker compose up -d social_graph_service
            docker image prune -f
